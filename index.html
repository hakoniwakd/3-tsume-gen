<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3手詰トレーニング</title>
  <meta name="theme-color" content="#5a3a1a">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./app.css">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>3手詰トレーニング</h1>
      <span id="difficulty-badge" class="difficulty-badge"></span>
    </header>

    <main class="app-main">
      <section class="board-area">
        <div id="hand-defender" class="hand" title="受方の持ち駒"></div>
        <canvas id="board"></canvas>
        <div id="hand-attacker" class="hand" title="攻方（あなた）の持ち駒"></div>
      </section>

      <aside class="info-panel">
        <div id="status" class="status">起動中…</div>
        <div id="progress" class="progress"></div>

        <div class="settings">
          <label>難易度:
            <select id="difficulty">
              <option value="">おまかせ</option>
              <option value="初級">初級</option>
              <option value="中級" selected>中級</option>
              <option value="上級">上級</option>
              <option value="有段">有段</option>
            </select>
          </label>
          <fieldset class="tag-group">
            <legend>含めるタグ</legend>
            <label><input type="checkbox" name="req" value="sacrifice"> 捨駒</label>
            <label><input type="checkbox" name="req" value="unpromote"> 不成</label>
            <label><input type="checkbox" name="req" value="pawn_drop"> 打歩詰</label>
            <label><input type="checkbox" name="req" value="limited_drop"> 限定打</label>
            <label><input type="checkbox" name="req" value="distant_drop"> 遠打</label>
            <label><input type="checkbox" name="req" value="small_pieces"> 小駒問題</label>
            <label><input type="checkbox" name="req" value="no_hand"> 持駒なし</label>
          </fieldset>
        </div>

        <div class="controls">
          <button id="new-problem">新しい問題</button>
          <button id="daily">📅 デイリー</button>
          <button id="undo">待った</button>
          <button id="hint">ヒント</button>
          <button id="reveal">解答を見る</button>
          <button id="reset">最初から</button>
          <button id="share">📤 共有URLコピー</button>
        </div>

        <div id="move-list" class="move-list"></div>
      </aside>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
